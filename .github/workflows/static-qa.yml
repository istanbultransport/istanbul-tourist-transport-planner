name: Static and Browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/static-qa.mjs

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/itp-http.log 2>&1 &
      - run: node scripts/browser-qa.mjs
