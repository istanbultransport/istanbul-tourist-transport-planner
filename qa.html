<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITP QA Smoke Tests</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#111;color:#eee}
h1{font-size:22px}.ok{color:#7ee787}.fail{color:#ff7b72}.info{color:#79c0ff}
#summary{font-weight:700;margin:16px 0}.test{padding:8px 0;border-bottom:1px solid #333}
iframe{position:absolute;width:1px;height:1px;left:-9999px;border:0}
</style>
</head>
<body>
<h1>ITP — Runtime QA Smoke Tests</h1>
<div id="summary" class="info">Uygulama yükleniyor…</div>
<div id="results"></div>
<iframe id="app" src="./index.html?qa=1"></iframe>
<script>
const out=document.getElementById('results');
const summary=document.getElementById('summary');
const tests=[];
function test(name,fn){
  try{const value=fn();tests.push({name,ok:value===true,detail:value===true?'PASS':String(value)});}
  catch(e){tests.push({name,ok:false,detail:e&&e.message?e.message:String(e)});}
}
function render(){
  out.innerHTML=tests.map(t=>'<div class="test '+(t.ok?'ok':'fail')+'">'+(t.ok?'✓':'✗')+' '+t.name+(t.ok?'':' — '+t.detail)+'</div>').join('');
  const passed=tests.filter(t=>t.ok).length;
  summary.textContent=passed+'/'+tests.length+' test geçti';
  summary.className=passed===tests.length?'ok':'fail';
}
async function run(){
  const frame=document.getElementById('app');
  await new Promise((resolve,reject)=>{
    if(frame.contentDocument && frame.contentDocument.readyState==='complete'){resolve();return;}
    const timer=setTimeout(()=>reject(new Error('index.html yükleme zaman aşımı')),10000);
    frame.addEventListener('load',()=>{clearTimeout(timer);resolve()}, {once:true});
  });
  const w=frame.contentWindow;
  await new Promise(r=>setTimeout(r,1200));

  test('Temel fonksiyonlar mevcut',()=>[
    'changeStart','changeTarget','selectStart','newRoute',
    'useCurrentLocation','buildAdaptiveStartAccess','lastMileStep'
  ].every(k=>typeof w[k]==='function'));

  test('Service Worker kaydı için kod mevcut',()=>typeof w.navigator.serviceWorker!=='undefined');

  test('Uygulama içi JavaScript sözdizimi hatasız',()=>{
    const scripts=[...w.document.querySelectorAll('script:not([src])')];
    return scripts.length>0 && scripts.every(s=>{try{new Function(s.textContent);return true;}catch(_){return false;}});
  });

  test('Başlangıç konum kartları ilk açılışta çiziliyor',()=>{
    return w.document.querySelectorAll('#list .place[data-id]').length>0;
  });

  test('Semt/turistik yer arama alanı görünür DOM içinde mevcut',()=>{
    return !!w.document.querySelector('#startPlaceSearch, #uiRecoveryPlaceSearch');
  });

  test('Avrupa/Anadolu filtreleri etkileşim alıyor',()=>{
    const btn=w.document.querySelector('.filter[data-filter="Anadolu Yakası"]');
    if(!btn) return false;
    btn.click();
    return btn.classList.contains('active') && w.document.querySelectorAll('#list .place[data-id]').length>0;
  });

  test('Şehri Keşfet paneli açılıp kapanıyor',()=>{
    const btn=w.document.getElementById('cityExploreTab'), panel=w.document.getElementById('cityExplorePanel');
    if(!btn||!panel) return false;
    btn.click(); const opened=panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='false';
    btn.click(); const closed=!panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='true';
    return opened&&closed;
  });

  test('Bilet yardım paneli açılıp kapanıyor',()=>{
    const btn=w.document.getElementById('ticketHelpTab'), panel=w.document.getElementById('ticketHelpPanel');
    if(!btn||!panel) return false;
    btn.click(); const opened=panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='false';
    btn.click(); const closed=!panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='true';
    return opened&&closed;
  });

  test('Kalıcı local/session storage kullanılmıyor',()=>{
    const src=w.document.documentElement.outerHTML;
    return !/localStorage|sessionStorage/.test(src);
  });

  test('Başlangıç değiştirme hedefi temizlemiyor',()=>{
    const marker={id:'qa-target',name:'QA hedefi'};
    w.eval("selectedTarget="+JSON.stringify(marker));
    const before=w.eval('selectedTarget');
    w.changeStart();
    return w.eval('selectedTarget')===before;
  });

  test('Hedef değiştirme başlangıcı koruyor',()=>{
    const marker={id:'qa-start',name:'QA başlangıcı'};
    w.eval("start="+JSON.stringify(marker));
    const before=w.eval('start');
    w.changeTarget();
    return w.eval('start')===before;
  });

  test('Yeni rota başlangıç ve hedefi temizliyor',()=>{
    w.eval("start={id:'qa-start',name:'QA'}; selectedTarget={id:'qa-target',name:'QA'}");
    w.newRoute();
    return w.eval('start')===null && w.eval('selectedTarget')===null;
  });

  test('selectStart fonksiyonu hedef kaybına neden olmuyor',()=>{
    const card=w.document.querySelector('#list .place[data-id]');
    if(!card) return 'Başlangıç kartı bulunamadı';
    const id=card.getAttribute('data-id');
    const original=w.buildRouteToTarget;
    w.buildRouteToTarget=()=>{};
    w.eval("selectedTarget={id:'qa-target',name:'QA hedefi'}");
    const before=w.eval('selectedTarget');
    try{w.selectStart(id);}finally{w.buildRouteToTarget=original;}
    return w.eval('selectedTarget')===before;
  });

  test('GPS değişkenleri tanımlı',()=>[
    'currentLocation','currentLocationStation','locationBusy'
  ].every(k=>w.eval('typeof '+k)!=='undefined'));

  test('GPS doğruluk koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /accuracy\s*>\s*1000|accuracy\s*>=\s*1000/.test(src);
  });

  test('15 dk erişim koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /15\s*\*\s*60|15\s*min|15 dakika/.test(src);
  });

  test('Canlı GPS istasyon kaynağı mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /GetStations/.test(src) && /liveGpsStationCoordinates/.test(src);
  });

  test('Birleşik canlı + statik GPS koordinat havuzu mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /gpsStationCoordinates\s*\(/.test(src) && /liveGpsStationCoordinates/.test(src);
  });

  test('Havalimanı için Marmaray aynı-node koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /same-node-marmaray-airport/.test(src);
  });

  test('Son ulaşımda doğrulanmamış otobüs uydurulmuyor',()=>{
    const src=w.document.documentElement.outerHTML;
    return /lastMileBusRegistry/.test(src);
  });

  render();
}
run().catch(e=>{summary.textContent='QA çalıştırılamadı: '+e.message;summary.className='fail';});
</script>
</body>
</html>
