<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITP QA Smoke Tests</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#111;color:#eee}
h1{font-size:22px}.ok{color:#7ee787}.fail{color:#ff7b72}.info{color:#79c0ff}
#summary{font-weight:700;margin:16px 0}.test{padding:8px 0;border-bottom:1px solid #333}
iframe{position:absolute;width:1px;height:1px;left:-9999px;border:0}
</style>
</head>
<body>
<h1>ITP — Runtime QA Smoke Tests</h1>
<div id="summary" class="info">Uygulama yükleniyor…</div>
<div id="results"></div>
<iframe id="app" src="./index.html?qa=1"></iframe>
<script>
const out=document.getElementById('results');
const summary=document.getElementById('summary');
const tests=[];
function test(name,fn){
  try{
    const value=fn();
    const ok=value===true || !!(value && typeof value==='object' && value.ok===true);
    const detail=value===true?'PASS':(value && typeof value==='object' && value.detail ? String(value.detail) : String(value));
    tests.push({name,ok,detail});
  } catch(e){tests.push({name,ok:false,detail:e&&e.message?e.message:String(e)});}
}
function render(){
  out.innerHTML=tests.map(t=>'<div class="test '+(t.ok?'ok':'fail')+'">'+(t.ok?'✓':'✗')+' '+t.name+(t.ok?'':' — '+t.detail)+'</div>').join('');
  const passed=tests.filter(t=>t.ok).length;
  summary.textContent=passed+'/'+tests.length+' test geçti';
  summary.className=passed===tests.length?'ok':'fail';
}
async function run(){
  const frame=document.getElementById('app');
  await new Promise((resolve,reject)=>{
    if(frame.contentDocument && frame.contentDocument.readyState==='complete'){resolve();return;}
    const timer=setTimeout(()=>reject(new Error('index.html yükleme zaman aşımı')),10000);
    frame.addEventListener('load',()=>{clearTimeout(timer);resolve()}, {once:true});
  });
  const w=frame.contentWindow;
  await new Promise(r=>setTimeout(r,1200));

  test('Temel fonksiyonlar mevcut',()=>[
    'changeStart','changeTarget','selectStart','newRoute',
    'useCurrentLocation','buildAdaptiveStartAccess','lastMileStep'
  ].every(k=>typeof w[k]==='function'));

  test('Service Worker kaydı için kod mevcut',()=>typeof w.navigator.serviceWorker!=='undefined');

  test('Uygulama içi JavaScript sözdizimi hatasız',()=>{
    const scripts=[...w.document.querySelectorAll('script:not([src])')];
    return scripts.length>0 && scripts.every(s=>{try{new Function(s.textContent);return true;}catch(_){return false;}});
  });

  test('Başlangıç konum kartları ilk açılışta çiziliyor ve görünür',()=>{
    const cards=[...w.document.querySelectorAll('#list .place[data-id]')];
    if(!cards.length) return false;
    const visible=el=>{
      const css=w.getComputedStyle(el), rect=el.getBoundingClientRect();
      return css.display!=='none' && css.visibility!=='hidden' && Number(css.opacity||1)>0 && rect.height>0;
    };
    return cards.slice(0,5).every(visible);
  });

  test('Semt/turistik yer arama alanı DOM içinde ve görünür',()=>{
    const el=w.document.querySelector('#startPlaceSearch, #uiRecoveryPlaceSearch');
    if(!el) return false;
    const css=w.getComputedStyle(el);
    return css.display!=='none' && css.visibility!=='hidden' && el.getBoundingClientRect().height>0;
  });

  test('Canlı build rozeti HTML build kimliğiyle eşleşiyor',()=>{
    const meta=w.document.querySelector('meta[name="build-id"]');
    const badge=w.document.getElementById('buildBadge');
    return !!meta && !!badge && meta.content===badge.textContent.trim() && meta.content===w.__APP_BUILD_ID__;
  });

  test('Yer araması sonuç listesini filtreliyor',()=>{
    const input=w.document.querySelector('#startPlaceSearch, #uiRecoveryPlaceSearch');
    if(!input) return false;
    input.value='Aqua Florya';
    input.dispatchEvent(new w.Event('input',{bubbles:true}));
    const cards=[...w.document.querySelectorAll('#list .place[data-id]')];
    const ok=cards.length>0 && cards.every(card=>/Aqua Florya/i.test(card.textContent));
    const clear=w.document.querySelector('.filter[data-filter="Tümü"]');
    if(clear) clear.click();
    const next=w.document.querySelector('#startPlaceSearch, #uiRecoveryPlaceSearch');
    if(next){next.value='';next.dispatchEvent(new w.Event('input',{bubbles:true}));}
    return ok;
  });

  test('Anadolu Yakası filtresi doğru kartları gösteriyor',()=>{
    const btn=w.document.querySelector('.filter[data-filter="Anadolu Yakası"]');
    if(!btn) return false;
    btn.click();
    const ids=[...w.document.querySelectorAll('#list .place[data-id]')].map(el=>el.dataset.id);
    const data=w.eval('places');
    return btn.classList.contains('active') && ids.length>0 && ids.every(id=>data.some(p=>p.id===id && p.side==='Anadolu Yakası'));
  });

  test('Avrupa Yakası filtresi doğru kartları gösteriyor',()=>{
    const btn=w.document.querySelector('.filter[data-filter="Avrupa Yakası"]');
    if(!btn) return false;
    btn.click();
    const ids=[...w.document.querySelectorAll('#list .place[data-id]')].map(el=>el.dataset.id);
    const data=w.eval('places');
    return btn.classList.contains('active') && ids.length>0 && ids.every(id=>data.some(p=>p.id===id && p.side==='Avrupa Yakası'));
  });

  test('Şehri Keşfet paneli açılıp kapanıyor',()=>{
    const btn=w.document.getElementById('cityExploreTab'), panel=w.document.getElementById('cityExplorePanel');
    if(!btn||!panel) return false;
    btn.click(); const opened=panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='false';
    btn.click(); const closed=!panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='true';
    return opened&&closed;
  });

  test('Şehri Keşfet kategorisi gerçek kartlar üretiyor',()=>{
    const open=w.document.getElementById('cityExploreTab');
    if(!open) return false;
    open.click();
    const category=w.document.querySelector('.discover-tab[data-discover="Stadyumlar"]');
    if(!category) return false;
    category.click();
    const hasCards=w.document.querySelectorAll('#discoverList .place[data-id]').length>0;
    open.click();
    return hasCards;
  });

  test('Bilet yardım paneli açılıp kapanıyor',()=>{
    const btn=w.document.getElementById('ticketHelpTab'), panel=w.document.getElementById('ticketHelpPanel');
    if(!btn||!panel) return false;
    btn.click(); const opened=panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='false';
    btn.click(); const closed=!panel.classList.contains('open') && panel.getAttribute('aria-hidden')==='true';
    return opened&&closed;
  });

  test('Ulaşım haritası açılıp kapanıyor',()=>{
    const btn=w.document.getElementById('transportMapTab');
    const panel=w.document.getElementById('transportMapOverlay');
    const close=w.document.getElementById('transportMapClose');
    if(!btn||!panel||!close) return false;
    btn.click();
    const opened=panel.classList.contains('open');
    close.click();
    const closed=!panel.classList.contains('open');
    return opened&&closed;
  });

  [
    'currentLocationProductionQA',
    'currentLocationPresentationQA',
    'lastMilePresentationQA',
    'v223CurrentLocationAccessQA',
    'v23012_6PendikAirportAccessQA',
    'v23012_6GpsBoardingPresentationQA',
    'v23012_6AirportBoardingGuardQA',
    'v223Fix3QA',
    'v223RouteDecisionQA',
    'v223SamePhysicalStationFinalAccessQA',
    'deepRouteRegressionQA',
    'v230AirportCorridorQA',
    'v230StationNavigationCoordinateQA',
    'v230StartModeIntegrityQA',
  ].forEach(name=>test('Dahili regresyon: '+name,()=>{
    if(typeof w[name]!=='function') return {ok:false,detail:'QA fonksiyonu bulunamadı'};
    const result=w[name]();
    const status=result && result.status;
    const failures=result && (result.failures||result.tests?.filter(t=>t.ok===false)||[]);
    return {ok:status==='PASS',detail:'status='+String(status)+'; hata='+(Array.isArray(failures)?failures.length:'bilinmiyor')};
  }));

  test('Kalıcı local/session storage kullanılmıyor',()=>{
    const src=w.document.documentElement.outerHTML;
    return !/localStorage|sessionStorage/.test(src);
  });

  test('Başlangıç değiştirme hedefi temizlemiyor',()=>{
    const marker={id:'qa-target',name:'QA hedefi'};
    w.eval("selectedTarget="+JSON.stringify(marker));
    const before=w.eval('selectedTarget');
    w.changeStart();
    return w.eval('selectedTarget')===before;
  });

  test('Hedef değiştirme başlangıcı koruyor',()=>{
    const marker={id:'qa-start',name:'QA başlangıcı'};
    w.eval("start="+JSON.stringify(marker));
    const before=w.eval('start');
    w.changeTarget();
    return w.eval('start')===before;
  });

  test('Yeni rota başlangıç ve hedefi temizliyor',()=>{
    w.eval("start={id:'qa-start',name:'QA'}; selectedTarget={id:'qa-target',name:'QA'}");
    w.newRoute();
    return w.eval('start')===null && w.eval('selectedTarget')===null;
  });

  test('selectStart fonksiyonu hedef kaybına neden olmuyor',()=>{
    const card=w.document.querySelector('#list .place[data-id]');
    if(!card) return 'Başlangıç kartı bulunamadı';
    const id=card.getAttribute('data-id');
    const original=w.buildRouteToTarget;
    w.buildRouteToTarget=()=>{};
    w.eval("selectedTarget={id:'qa-target',name:'QA hedefi'}");
    const before=w.eval('selectedTarget');
    try{w.selectStart(id);}finally{w.buildRouteToTarget=original;}
    const targetSearch=!!w.document.querySelector('#targetPlaceSearch, #uiRecoveryPlaceSearch');
    return w.eval('selectedTarget')===before && !!w.eval('start') && targetSearch;
  });

  test('GPS değişkenleri tanımlı',()=>[
    'currentLocation','currentLocationStation','locationBusy'
  ].every(k=>w.eval('typeof '+k)!=='undefined'));

  test('GPS doğruluk koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /accuracy\s*>\s*1000|accuracy\s*>=\s*1000/.test(src);
  });

  test('15 dk erişim koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /15\s*\*\s*60|15\s*min|15 dakika/.test(src);
  });

  test('Canlı GPS istasyon kaynağı mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /GetStations/.test(src) && /liveGpsStationCoordinates/.test(src);
  });

  test('Birleşik canlı + statik GPS koordinat havuzu mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /gpsStationCoordinates\s*\(/.test(src) && /liveGpsStationCoordinates/.test(src);
  });

  test('Havalimanı için Marmaray aynı-node koruması mevcut',()=>{
    const src=w.document.documentElement.outerHTML;
    return /same-node-marmaray-airport/.test(src);
  });

  test('Son ulaşımda doğrulanmamış otobüs uydurulmuyor',()=>{
    const src=w.document.documentElement.outerHTML;
    return /lastMileBusRegistry/.test(src);
  });


  test('İşletme kayıtları gerçek arama kataloğuna ekli ve koordinatlı',()=>{
    const rows=w.eval('places');
    const expected=['four_seasons_sultanahmet','karakoy_lokantasi','ciya_sofrasi'];
    return expected.every(id=>{const p=rows.find(x=>x.id===id);return !!p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&String(p.desc||'').length>10;});
  });

  test('Karttan başlangıç seçimi kanonik ID/koordinatı koruyor',()=>{
    const p=w.eval("places.find(x=>x.id==='karakoy_lokantasi')");
    if(!p) return false;
    w.selectStart(p.id);
    const s=w.eval('start');
    const ok=!!s&&s.id===p.id&&s.lat===p.lat&&s.lng===p.lng;
    w.newRoute();
    return ok;
  });

  test('İşletme hedef seçimi aynı katalog nesnesini koruyor',()=>{
    const a=w.eval("places.find(x=>x.id==='kadikoy_carsi')");
    const b=w.eval("places.find(x=>x.id==='ciya_sofrasi')");
    if(!a||!b) return false;
    w.selectStart(a.id);
    w.selectDestination(b.id);
    const s=w.eval('start'), t=w.eval('selectedTarget');
    const ok=s?.id===a.id&&s?.lat===a.lat&&s?.lng===a.lng&&t?.id===b.id&&t?.lat===b.lat&&t?.lng===b.lng;
    w.newRoute();
    return ok;
  });

  test('Faros yaklaşık koordinatla üretim kataloğuna sokulmuyor',()=>!w.eval("places.some(p=>p.id==='faros_karakoy')"));

  // This block executes the 40 data fixtures in a real browser against the actual
  // app's route graph. Engine-path checks are distinct from field ETA verification.
  const routeCases = [{"id":"R01","from":"pendik","to":"istanbul-airport","focus":"Havalimanı; istasyon düğümü ile ilçe merkezini ayırt et."},{"id":"R02","from":"kadikoy_carsi","to":"ayasofya","focus":"Kıtalar arası geçiş ve son yürüme."},{"id":"R03","from":"hilton_istanbul_bosphorus","to":"sabiha","focus":"Otel başlangıcı ve havalimanı rotası."},{"id":"R04","from":"ciya_sofrasi","to":"taksim_meydani","focus":"Restoran arama/koordinat handoff; adresi doğrula."},{"id":"R05","from":"taksim_meydani","to":"sabiha","focus":"Anadolu yakasına havalimanı rotası."},{"id":"R06","from":"sabiha","to":"kadikoy_carsi","focus":"Havalimanı çıkış noktası ve doğru istasyon."},{"id":"R07","from":"sirkeci_turist","to":"pendik_yht","focus":"Marmaray/YHT istasyon ayrımını kontrol et."},{"id":"R08","from":"uskudar","to":"ayasofya","focus":"İskele/rail alternatifleri ve son yürüme."},{"id":"R09","from":"galata","to":"dolmabahce","focus":"Yokuş, yürüyüş ve uygun istasyon."},{"id":"R10","from":"ortakoy_meydani","to":"taksim_meydani","focus":"Son ulaşım ve yaya süresi."},{"id":"R11","from":"besiktas","to":"kadikoy_carsi","focus":"Deniz ulaşımı alternatifi."},{"id":"R12","from":"moda_sahili","to":"sabiha","focus":"Anadolu yakası havalimanı rotası."},{"id":"R13","from":"four_seasons_sultanahmet","to":"istanbul-airport","focus":"İşletme adresi/koordinatı doğrulanmalı."},{"id":"R14","from":"cvk_park_bosphorus","to":"karakoy_rihtim","focus":"Otel → rıhtım, son yürüyüş."},{"id":"R15","from":"karakoy_lokantasi","to":"uskudar","focus":"Restoran başlangıcı ve kıtalar arası geçiş."},{"id":"R16","from":"ayasofya","to":"sultanahmet_camii","focus":"Yakın hedef; gereksiz toplu taşıma üretme."},{"id":"R17","from":"dolmabahce","to":"besiktas","focus":"Kısa yürüyüş alternatifini kontrol et."},{"id":"R18","from":"taksim_meydani","to":"galata","focus":"Yokuş ve gerçek yürüme güzergâhı."},{"id":"R19","from":"hilton_istanbul_bosphorus","to":"ortakoy_meydani","focus":"Otel başlangıcı ve son ulaşım."},{"id":"R20","from":"ciya_sofrasi","to":"moda_sahili","focus":"Restoran koordinatının hedefe aktarılması."},{"id":"R21","from":"istanbul_marriott_hotel_asia","to":"kadikoy_carsi","focus":"Anadolu yakası otelinden şehir merkezine."},{"id":"R22","from":"doubletree_istanbul_moda","to":"sabiha","focus":"Otel seçimi ve havalimanı bağlantısı."},{"id":"R23","from":"wyndham_grand_kalamis","to":"bostanci_sahili","focus":"Kısa mesafe; yürüme makullüğü."},{"id":"R24","from":"radisson_blu_istanbul_asia","to":"istanbul-airport","focus":"Uzun mesafe ve aktarma tutarlılığı."},{"id":"R25","from":"dedeman_istanbul","to":"galata","focus":"Otel adresi ile hedef koordinat eşleşmesi."},{"id":"R26","from":"karakoy_lokantasi","to":"topkapi","focus":"Restoran başlangıcı ve tarihî yarımada hedefi."},{"id":"R27","from":"faros_karakoy","to":"istanbul_modern","focus":"Restoran işletme konumu ve son yürüyüş."},{"id":"R28","from":"aqua_florya","to":"sirkeci_turist","focus":"Florya’dan raylı sistem erişimi."},{"id":"R29","from":"buyukada","to":"kadikoy_carsi","focus":"Ada ulaşımı; uygun iskele/feribot adımları."},{"id":"R30","from":"heybeliada","to":"eminonu","focus":"Ada → Avrupa yakası iskele rotası."},{"id":"R31","from":"moda_sahili","to":"galata","focus":"Anadolu yakası sahilinden Avrupa yakasına; iskele/aktarma adımları."},{"id":"R32","from":"miniaturk","to":"pierre_loti","focus":"Haliç çevresi, yürüyüş ve bağlantılar."},{"id":"R33","from":"kapalicarsi","to":"misircarsisi","focus":"Yakın hedef; gereksiz uzun rota olmamalı."},{"id":"R34","from":"istanbul_modern","to":"galataport","focus":"Kısa yürüme/uygun erişim."},{"id":"R35","from":"beylerbeyi","to":"kiz_kulesi","focus":"İskele bağlantısı ve yürüme."},{"id":"R36","from":"bagdat_caddesi","to":"fenerbahce_park","focus":"Anadolu yakası yaya/rail karşılaştırması."},{"id":"R37","from":"the_green_park_pendik","to":"sabiha","focus":"Pendik otelinden SAW; yakın ulaşım ve son yürüyüş."},{"id":"R38","from":"istanbul_akvaryum","to":"istanbul-airport","focus":"Uzak mesafe ve aktarma kontrolü."},{"id":"R39","from":"topkapi","to":"yerebatan","focus":"Yakın turistik hedef; son yürüme."},{"id":"R40","from":"istanbul_marriott_hotel_asia","to":"galata","focus":"Otel başlangıcı, iki yaka ve aktarmalar."}];
  const routeFixtureResults = routeCases.map(item=>{
    try{
      const knownPlace=id=>w.eval('places.some(p=>p.id==='+JSON.stringify(id)+')');
      const endpointsKnown=knownPlace(item.from)&&knownPlace(item.to);
      const from=w.eval('places.find(p=>p.id==='+JSON.stringify(item.from)+')');
      const to=w.eval('places.find(p=>p.id==='+JSON.stringify(item.to)+')');
      let path=null, source='place';
      if(endpointsKnown){
        if(w.eval('specialStartIds.has('+JSON.stringify(item.from)+')')){
          path=w.eval('route('+JSON.stringify(item.from)+','+JSON.stringify(item.to)+')');
          source='place/route';
        } else {
          path=w.eval('route('+JSON.stringify(item.from)+','+JSON.stringify(item.to)+')');
          if(!path) path=w.eval('minimumRailRoute('+JSON.stringify(item.from)+','+JSON.stringify(item.to)+',4,null,null)');
          if(!path){
            const candidates=w.eval('generateRouteCandidates('+JSON.stringify(item.from)+','+JSON.stringify(item.to)+')');
            const best=w.eval('selectBestRoute('+JSON.stringify(item.from)+','+JSON.stringify(item.to)+')');
            path=best?.path || candidates?.[0]?.path || null;
            source='candidate';
          }
        }
      }
      // Route engine is expected to find a path for connected cases, but no
      // synthetic ETA or route is invented to force a passing result.
      const ok=endpointsKnown&&Array.isArray(path)&&path.length>0&&w.eval('validateRoute('+JSON.stringify(path)+').ok')===true;
      return {id:item.id,from:item.from,to:item.to,ok,source,steps:Array.isArray(path)?path.length:0,detail:ok?'validated engine path':!endpointsKnown?'endpoint missing from place catalogue':'route not found or validation failed'};
    }catch(e){return {id:item.id,from:item.from,to:item.to,ok:false,detail:String(e?.message||e)};}
  });
  window.__ITP_ROUTE_FIXTURE_RESULTS__ = routeFixtureResults;
  routeFixtureResults.forEach(r=>test('Rota senaryosu '+r.id,()=>({ok:r.ok,detail:r.detail+' ('+r.from+' → '+r.to+')'})));

  render();
}
run().catch(e=>{summary.textContent='QA çalıştırılamadı: '+e.message;summary.className='fail';});
</script>
</body>
</html>
